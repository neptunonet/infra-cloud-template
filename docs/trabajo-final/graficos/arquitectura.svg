<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" role="img" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" aria-label="Arquitectura híbrida: los datos nacen y el modelo se entrena a diario en el VPS; el bucket de GCS guarda datasets y versiones; GKE se prende por sesiones para servir la API, registrar en Postgres y medir; GitHub Actions construye las imágenes y despliega con OIDC.">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a38"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
  </defs>

  <!-- GitHub -->
  <rect x="300" y="14" width="780" height="100" rx="8" fill="#f2f2f0" stroke="#8a8a86"/>
  <text x="314" y="34" font-weight="bold" fill="#1f1f1e">GitHub Actions · OIDC (sin claves)</text>
  <rect x="320" y="46" width="240" height="56" rx="6" fill="#ffffff" stroke="#8a8a86"/>
  <text x="440" y="68" text-anchor="middle" fill="#1f1f1e">ci.yml: tests + build multi-arch</text>
  <text x="440" y="88" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5f5f5c">ci-artifact-writer</text>
  <rect x="820" y="46" width="240" height="56" rx="6" fill="#ffffff" stroke="#8a8a86"/>
  <text x="940" y="68" text-anchor="middle" fill="#1f1f1e">deploy.yml: desplegar / apagar</text>
  <text x="940" y="88" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5f5f5c">ci-deployer · aprobación en «dev»</text>

  <!-- Artifact Registry -->
  <rect x="320" y="160" width="240" height="64" rx="6" fill="#ffffff" stroke="#8a8a86"/>
  <text x="440" y="185" text-anchor="middle" font-weight="bold" fill="#1f1f1e">Artifact Registry</text>
  <text x="440" y="205" text-anchor="middle" fill="#1f1f1e">lluvia (amd64 + arm64)</text>

  <!-- VPS -->
  <rect x="20" y="140" width="240" height="430" rx="8" fill="#f6f1e7" stroke="#a8946b"/>
  <text x="34" y="162" font-weight="bold" fill="#1f1f1e">VPS Oracle (ARM64) · 24/7</text>
  <rect x="36" y="178" width="208" height="64" rx="6" fill="#ffffff" stroke="#a8946b"/>
  <text x="140" y="203" text-anchor="middle" fill="#1f1f1e">Clima Rutero</text>
  <text x="140" y="222" text-anchor="middle" font-size="10.5" fill="#5f5f5c">app, verificación (METAR, GLM)</text>
  <rect x="36" y="300" width="208" height="64" rx="6" fill="#ffffff" stroke="#a8946b"/>
  <text x="140" y="324" text-anchor="middle" fill="#1f1f1e">cron 07:00 · exportar.py</text>
  <text x="140" y="344" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5f5f5c">lluvia-export</text>
  <rect x="36" y="420" width="208" height="64" rx="6" fill="#ffffff" stroke="#a8946b"/>
  <text x="140" y="444" text-anchor="middle" fill="#1f1f1e">cron 07:30 · train.py</text>
  <text x="140" y="464" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5f5f5c">lluvia-entrena</text>
  <text x="140" y="520" text-anchor="middle" font-size="10.5" fill="#5f5f5c">misma imagen, etiqueta v0.1.0</text>
  <line x1="140" y1="242" x2="140" y2="300" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="148" y="275" font-size="10.5" fill="#3a3a38">verificación del día anterior</text>

  <!-- GCS -->
  <rect x="320" y="280" width="240" height="290" rx="8" fill="#eaf2fb" stroke="#6f97c8"/>
  <text x="334" y="302" font-weight="bold" fill="#1f1f1e">GCS · gs://unlu-ia-armas-lluvia</text>
  <text x="334" y="318" font-size="10.5" fill="#5f5f5c">persistente (envs/tf-persistente)</text>
  <rect x="336" y="332" width="208" height="44" rx="6" fill="#ffffff" stroke="#6f97c8"/>
  <text x="440" y="359" text-anchor="middle" fill="#1f1f1e">datasets/AAAA-MM-DD.parquet</text>
  <rect x="336" y="420" width="208" height="64" rx="6" fill="#ffffff" stroke="#6f97c8"/>
  <text x="440" y="444" text-anchor="middle" fill="#1f1f1e">modelos/versiones/v…/</text>
  <text x="440" y="464" text-anchor="middle" font-size="10.5" fill="#5f5f5c">modelo.joblib + metadata.json</text>
  <rect x="336" y="510" width="208" height="44" rx="6" fill="#ffffff" stroke="#6f97c8"/>
  <text x="440" y="537" text-anchor="middle" fill="#1f1f1e">modelos/activa.json</text>
  <line x1="440" y1="484" x2="440" y2="510" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="448" y="501" font-size="10.5" fill="#3a3a38">si se promueve</text>

  <!-- VPS <-> GCS -->
  <line x1="244" y1="340" x2="336" y2="352" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="252" y="334" font-size="10.5" fill="#3a3a38">sube el día</text>
  <line x1="336" y1="366" x2="244" y2="440" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="270" y="392" font-size="10.5" fill="#3a3a38">lee</text>
  <line x1="244" y1="462" x2="336" y2="456" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="256" y="478" font-size="10.5" fill="#3a3a38">versión nueva</text>

  <!-- GKE -->
  <rect x="620" y="140" width="460" height="430" rx="8" fill="#eaf6ef" stroke="#5aa97f"/>
  <text x="634" y="162" font-weight="bold" fill="#1f1f1e">GKE · solo en sesiones (envs/dev, e2-standard-2 × 1–2)</text>
  <rect x="640" y="178" width="230" height="52" rx="6" fill="#ffffff" stroke="#5aa97f" stroke-dasharray="5 3"/>
  <text x="755" y="200" text-anchor="middle" fill="#1f1f1e">CronJob entrenamiento</text>
  <text x="755" y="218" text-anchor="middle" font-size="10.5" fill="#5f5f5c">suspendido; se corre a mano</text>
  <rect x="640" y="268" width="230" height="74" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="755" y="291" text-anchor="middle" font-weight="bold" fill="#1f1f1e">API lluvia · HPA 1–5</text>
  <text x="755" y="310" text-anchor="middle" fill="#1f1f1e">POST /predict · /healthz · /metrics</text>
  <text x="755" y="329" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5f5f5c">lluvia-servicio (Workload Identity)</text>
  <rect x="640" y="392" width="180" height="48" rx="6" fill="#ffffff" stroke="#5aa97f"/>
  <text x="730" y="413" text-anchor="middle" fill="#1f1f1e">Job cargar-versiones</text>
  <text x="730" y="430" text-anchor="middle" font-size="10.5" fill="#5f5f5c">hook de Helm</text>
  <rect x="640" y="484" width="230" height="64" rx="6" fill="#ffffff" stroke="#5aa97f"/>
  <text x="755" y="508" text-anchor="middle" fill="#1f1f1e">Postgres (StatefulSet + PVC)</text>
  <text x="755" y="527" text-anchor="middle" font-size="10.5" fill="#5f5f5c">pedidos · predicciones · versiones</text>
  <text x="755" y="541" text-anchor="middle" font-size="10.5" fill="#5f5f5c">· evaluaciones</text>
  <rect x="910" y="268" width="152" height="112" rx="6" fill="#ffffff" stroke="#5aa97f"/>
  <text x="986" y="292" text-anchor="middle" font-weight="bold" fill="#1f1f1e">kube-prometheus</text>
  <text x="986" y="314" text-anchor="middle" fill="#1f1f1e">Prometheus</text>
  <text x="986" y="334" text-anchor="middle" fill="#1f1f1e">Grafana</text>
  <text x="986" y="354" text-anchor="middle" fill="#1f1f1e">Alertmanager</text>

  <!-- dentro de GKE -->
  <line x1="910" y1="305" x2="870" y2="305" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="890" y="298" text-anchor="middle" font-size="10.5" fill="#3a3a38">scrape</text>
  <line x1="850" y1="342" x2="850" y2="484" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="858" y="420" font-size="10.5" fill="#3a3a38">registra</text>
  <text x="858" y="434" font-size="10.5" fill="#3a3a38">(2º plano)</text>
  <line x1="700" y1="440" x2="700" y2="484" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#flecha)"/>

  <!-- GCS <-> GKE -->
  <polyline points="544,532 610,532 610,330 640,330" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#flecha-azul)"/>
  <text x="584" y="512" text-anchor="middle" font-size="10.5" fill="#2a78d6">relee</text>
  <text x="584" y="525" text-anchor="middle" font-size="10.5" fill="#2a78d6">c/5 min</text>
  <line x1="544" y1="440" x2="640" y2="416" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="564" y="402" font-size="10.5" fill="#3a3a38">metadata</text>

  <!-- consumidor -->
  <polyline points="244,252 590,252 590,292 640,292" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#flecha-azul)"/>
  <text x="300" y="246" font-size="10.5" fill="#2a78d6">POST /predict (consumidor; opcional en el TF)</text>

  <!-- CI/CD -->
  <line x1="440" y1="102" x2="440" y2="160" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="448" y="136" font-size="10.5" fill="#3a3a38">push :sha</text>
  <line x1="940" y1="102" x2="940" y2="140" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="948" y="126" font-size="10.5" fill="#3a3a38">tofu + helm</text>
  <line x1="320" y1="192" x2="260" y2="192" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="290" y="184" text-anchor="middle" font-size="10.5" fill="#3a3a38">pull</text>
  <line x1="560" y1="192" x2="620" y2="192" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="590" y="184" text-anchor="middle" font-size="10.5" fill="#3a3a38">pull</text>

  <!-- Telegram -->
  <rect x="910" y="610" width="152" height="44" rx="6" fill="#ffffff" stroke="#8a8a86"/>
  <text x="986" y="637" text-anchor="middle" fill="#1f1f1e">Telegram</text>
  <line x1="986" y1="380" x2="986" y2="610" stroke="#3a3a38" stroke-width="1.4" marker-end="url(#flecha)"/>
  <text x="994" y="596" font-size="10.5" fill="#3a3a38">alertas Lluvia*</text>
</svg>
