# Headless (lo pide el StatefulSet para darle nombre estable al pod). Con una sola réplica, «postgres:5432» resuelve
# directo a postgres-0.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    app: {{ include "postgres.fullname" . }}
spec:
  clusterIP: None
  selector:
    app: {{ include "postgres.fullname" . }}
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
