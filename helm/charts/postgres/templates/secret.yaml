{{- /*
Contraseña generada por el chart. `lookup` lee el Secret que ya existe para no cambiarla en cada upgrade (Postgres
solo la toma al crear el volumen: si cambiara, la API dejaría de conectarse). Con `helm template` o --dry-run no hay
clúster y sale una al azar, que no se aplica.
`keep`: un `helm uninstall` no lo borra, igual que el PVC; el borrado de los dos es a mano y a propósito.
*/ -}}
{{- $nombre := include "postgres.fullname" . -}}
{{- $previo := lookup "v1" "Secret" .Release.Namespace $nombre -}}
{{- $clave := "" -}}
{{- if $previo -}}
{{- $clave = index $previo.data "POSTGRES_PASSWORD" | b64dec -}}
{{- else -}}
{{- $clave = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $nombre }}
  labels:
    app: {{ $nombre }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $clave | quote }}
  # Lo que usan la API y el Job de carga (secretKeyRef). Mismo namespace.
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.base.usuario $clave $nombre .Values.service.port .Values.base.nombre | quote }}
