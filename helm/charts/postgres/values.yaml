# Postgres propio dentro del clúster (no Cloud SQL: cuesta aunque no se use). Sirve igual en k3d y en GKE; solo cambia
# la clase de disco, que toma la por defecto de cada clúster (local-path en k3d, standard-rwo en GKE).
# Instalarlo con el nombre de release «postgres»: la API lo busca en postgres:5432.
image:
  repository: postgres
  tag: 18.6-trixie   # misma Debian que la imagen de lluvia
  pullPolicy: IfNotPresent

base:
  nombre: lluvia
  usuario: lluvia
  # La contraseña la genera el chart la primera vez (Secret <release>, llaves POSTGRES_PASSWORD y DATABASE_URL) y la
  # conserva en cada upgrade. Nunca va en values ni en el repo.

service:
  port: 5432

persistencia:
  tamano: 1Gi          # con 156 tramos por pedido, ~25 MB cada 10.000 pedidos
  storageClass: ""     # vacío = la clase por defecto del clúster

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
