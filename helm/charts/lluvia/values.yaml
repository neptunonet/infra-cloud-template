# Valores por defecto del chart lluvia, pensados para GKE.
#   GKE:        --set image.repository=$AR/lluvia --set image.tag=<sha>
#   k3s / k3d:  -f helm/charts/lluvia/values-k3s.yaml
# Instalarlo con el nombre de release «lluvia» para que los nombres coincidan con la documentación.
image:
  # Artifact Registry: <REGION>-docker.pkg.dev/<PROJECT_ID>/infra-cloud-template/lluvia
  repository: lluvia
  tag: latest
  pullPolicy: IfNotPresent

# Solo se usa con autoscaling.enabled=false. Para las pruebas del TF (1, 3 y 5 réplicas) se apaga el HPA y se fija acá.
replicaCount: 1

service:
  port: 8083

# Dónde train.py deja `activa.json` y `versiones/`. La API lo relee cada `recargaSeg` segundos: una versión nueva se
# toma sin reiniciar pods.
modelos:
  destino: gs://unlu-ia-armas-lluvia/modelos
  recargaSeg: 300

# Cómo se autentica contra GCS. Se usa una de las dos:
gcp:
  # GKE con Workload Identity: la cuenta de Kubernetes se vincula con esta cuenta de GCP (lluvia-servicio). Sin claves.
  cuentaServicio: ""   # p. ej. lluvia-servicio@unlu-ia-armas.iam.gserviceaccount.com
  # Fuera de GCP (k3d): Secret con la clave JSON de lluvia-servicio, en la llave `clave.json`.
  secretCredenciales: ""

# Registro de pedidos y predicciones en Postgres (chart postgres): la llave DATABASE_URL de este Secret. Es opcional:
# si el Secret no existe, la API arranca igual y no registra. Vacío = sin registro.
baseDatos:
  secret: postgres
  # Cada pedido guarda su resumen; el detalle tramo por tramo, uno de cada N (1 = todos, 0 = ninguno). Guardando todos,
  # el ensayo de carga del 12/11 llevó la base a 4,6 GB (40 M filas).
  muestraTramos: 20

# Claves por consumidor para /predict («consumidor:clave,...»). Nunca en values: Secret con la llave `CLAVES`.
# Vacío = /predict sin clave (solo para pruebas).
secretClaves: ""

# Medido en la notebook (11/11): 4.810 tramos en 100–160 ms; ~210 MiB con el modelo cargado. Ensayo de carga (12/11):
# con 1 réplica y lotes de 4.810, 428 MiB: el límite de 512 quedaba justo.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

# Job que pasa los metadata.json del bucket a las tablas versiones y evaluaciones de Postgres (cargar_versiones.py).
# Corre como hook de Helm después de cada install/upgrade: al prender el clúster, la base queda al día con lo que
# entrenó el VPS. Idempotente; sin el Secret de Postgres termina sin hacer nada.
cargaVersiones:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Servicio de entrenamiento dentro del clúster (consigna 2.3): CronJob con train.py y, al terminar, cargar_versiones.py.
# Suspendido por defecto: el entrenamiento diario corre en el VPS a las 07:30 UTC (decisión 30) y dos entrenamientos
# por día se pisarían el puntero activa.json. Para correrlo a mano:
#   kubectl create job --from=cronjob/lluvia-entrenamiento entrenamiento-manual
# Para que el clúster reemplace al VPS: entrenamiento.suspendido=false (y sacar el cron del VPS).
entrenamiento:
  enabled: true
  suspendido: true
  horario: "30 7 * * *"   # UTC, el mismo del VPS
  datos: gs://unlu-ia-armas-lluvia/datasets/*.parquet
  destino: ""             # vacío = modelos.destino (lo que sirve la API)
  resources:              # medido en el VPS: ~280 MB y 30–35 s de evaluación con 1 CPU
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
