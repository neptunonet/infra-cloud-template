# Cuenta propia (no la `default` del namespace). En GKE la anotación la vincula con la cuenta de GCP lluvia-servicio
# (Workload Identity): el pod lee el bucket sin ninguna clave.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lluvia.fullname" . }}
  labels:
    app: {{ include "lluvia.fullname" . }}
  {{- with .Values.gcp.cuentaServicio }}
  annotations:
    iam.gke.io/gcp-service-account: {{ . }}
  {{- end }}
automountServiceAccountToken: false
