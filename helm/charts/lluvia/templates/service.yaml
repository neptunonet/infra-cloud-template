apiVersion: v1
kind: Service
metadata:
  name: {{ include "lluvia.fullname" . }}
  labels:
    app: {{ include "lluvia.fullname" . }}
    # Etiqueta fija (no depende del release): la usa el ServiceMonitor de Prometheus.
    app.kubernetes.io/name: lluvia
spec:
  selector:
    app: {{ include "lluvia.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
