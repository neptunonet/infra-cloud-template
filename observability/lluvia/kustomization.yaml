# Trabajo Final: todo lo de observabilidad de lluvia en un solo apply (después de instalar kube-prom):
#   kubectl apply -k observability/lluvia/
# El dashboard va como ConfigMap con la etiqueta grafana_dashboard=1: el sidecar de Grafana lo carga solo, en
# cualquier namespace. Así el dashboard vive en el repo y no se pierde con el clúster (devolución del Lab 6).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - servicemonitor.yaml
  - alertas.yaml
configMapGenerator:
  - name: dashboard-lluvia
    files:
      - dashboard-lluvia.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
