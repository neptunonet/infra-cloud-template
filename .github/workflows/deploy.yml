# Class 8 (caso integrador): Terraform (network + GKE) and then the Helm
# charts, with an image tag that ci.yml already pushed. Manual trigger only:
#   Actions > deploy > Run workflow > env=dev, image_tag=<git sha or vX.Y.Z>, charts=<the charts your lab asks for>
#
# Trabajo Final (devolución del Lab 8): accion=apagar cierra la sesión por el mismo flujo, con la misma aprobación:
# primero desinstala las releases y borra los PVC (si no, los discos de GCE quedan huérfanos y se siguen cobrando) y
# después Terraform destruye el clúster (enable_gke=false). La red queda (no cuesta).
#   TF, prender:  accion=desplegar, image_tag=<sha>, charts="postgres lluvia"
#   TF, apagar:   accion=apagar
#
# Prerequisites (docs/clase-08.md has the commands):
#   - the tfstate bucket gs://<GCP_PROJECT_ID>-tfstate exists;
#   - repository variables GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER and
#     GCP_DEPLOY_SERVICE_ACCOUNT (or GCP_SERVICE_ACCOUNT); optional GCP_REGION
#     (default us-central1), GCP_ZONE (default us-central1-a),
#     AR_REPOSITORY (default infra-cloud-template);
#   - that service account can run Terraform and talk to GKE (roles
#     compute.admin, container.admin, artifactregistry.admin,
#     iam.serviceAccountUser and storage.objectAdmin on the bucket). The class-4
#     ci-artifact-writer account (artifactregistry.writer only) is NOT enough.
#   - GitHub Environments named dev and prod. A required reviewer on them is
#     the manual approval gate, but it needs a public repo (or a paid plan).
name: deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Terraform env (dev or prod)"
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      accion:
        description: "desplegar (Terraform + charts) o apagar (vacía el clúster y lo destruye)"
        required: true
        default: desplegar
        type: choice
        options: [desplegar, apagar]
      image_tag:
        description: "Image tag pushed by ci.yml: the full git sha or vX.Y.Z (never latest). Not used by apagar."
        required: false
        type: string
      charts:
        description: "Charts to deploy (space separated, those missing in helm/charts are skipped). Default: servicio-patron."
        required: false
        default: "servicio-patron"
        type: string

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ZONE: ${{ vars.GCP_ZONE || 'us-central1-a' }}
  AR_REPO: ${{ vars.AR_REPOSITORY || 'infra-cloud-template' }}
  TF_ENV: ${{ inputs.env }}
  IMAGE_TAG: ${{ inputs.image_tag }}
  ACCION: ${{ inputs.accion }}

jobs:
  # Solo al apagar: deja el clúster vacío antes de destruirlo. Los PVC de GKE son discos de GCE que no se borran con
  # el clúster; borrándolos acá, el driver de discos los elimina.
  vaciar:
    if: inputs.accion == 'apagar'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - name: Is there a cluster?
        id: hay
        run: |
          if gcloud container clusters describe "infra-cloud-${TF_ENV}-gke" --zone "$ZONE" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "cluster=si" >> "$GITHUB_OUTPUT"
          else
            echo "No cluster: nothing to empty"; echo "cluster=no" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.hay.outputs.cluster == 'si'
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: infra-cloud-${{ inputs.env }}-gke
          location: ${{ env.ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - if: steps.hay.outputs.cluster == 'si'
        uses: azure/setup-helm@v5

      - name: helm uninstall + delete PVCs
        if: steps.hay.outputs.cluster == 'si'
        run: |
          helm list -A -o json | jq -r '.[] | "\(.name) \(.namespace)"' | while read -r r ns; do
            helm uninstall "$r" -n "$ns" --wait --timeout 5m
          done
          # Los PVC y el Secret de Postgres quedan a propósito después de un uninstall (keep): acá se borran.
          kubectl delete pvc --all -A --wait=true --timeout=5m
          # Espera a que el driver borre los discos (los PV pasan de Released a borrados).
          for i in $(seq 60); do
            n="$(kubectl get pv --no-headers 2>/dev/null | wc -l)"
            [ "$n" -eq 0 ] && break
            echo "PV restantes: $n"; sleep 5
          done
          kubectl get pv
          gcloud compute disks list --project "$PROJECT_ID" --filter="name~^pvc-" --format="table(name,zone,sizeGb,users)"

  terraform:
    needs: vaciar
    # Corre si vaciar terminó bien o se salteó (desplegar).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }} # manual-approval gate (if your plan allows it)
    defaults:
      run:
        working-directory: terraform/envs/${{ inputs.env }}
    steps:
      - uses: actions/checkout@v7

      - name: Check inputs and variables
        run: |
          [ -n "$PROJECT_ID" ] || { echo "::error::repository variable GCP_PROJECT_ID is empty"; exit 1; }
          if [ "$ACCION" = desplegar ]; then
            case "$IMAGE_TAG" in
              latest|"") echo "::error::image_tag must be a git sha or vX.Y.Z pushed by ci.yml"; exit 1 ;;
            esac
          fi

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      # Lab 8: the remote state was written by OpenTofu 1.13.1 (providers
      # registered as registry.opentofu.org/hashicorp/google), so the job uses
      # the same tool and version as the notebook instead of hashicorp/terraform.
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.1

      - name: tofu init
        run: tofu init -input=false -backend-config="bucket=${PROJECT_ID}-tfstate"

      # Lab 8: dev.tfvars is git-ignored, so without these flags the job would
      # plan with the defaults (create the Artifact Registry that already
      # exists -> 409, create the class-2 VM, e2-small nodes too small for the
      # observability stack). They mirror terraform/envs/dev/dev.tfvars.
      - name: tofu plan
        run: |
          extra=()
          if [ "$TF_ENV" = dev ]; then
            extra=(-var="enable_artifact_registry=false" -var="enable_vm=false" -var="gke_machine_type=e2-standard-2"
                   -var='workload_identity_cuentas={"default/lluvia"="lluvia-servicio"}')
          fi
          gke=true; [ "$ACCION" = apagar ] && gke=false
          tofu plan -input=false -out=tfplan \
            -var="project_id=$PROJECT_ID" \
            -var="region=$REGION" \
            -var="zone=$ZONE" \
            -var="enable_gke=$gke" \
            -var="servicio_patron_image=$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/app:${IMAGE_TAG:-none}" \
            "${extra[@]}"

      # Applies exactly the plan above (the reviewer of the environment, if
      # any, approved this run before the job started).
      - name: tofu apply
        run: tofu apply -input=false tfplan

  helm:
    needs: terraform
    if: ${{ inputs.accion == 'desplegar' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: infra-cloud-${{ inputs.env }}-gke
          location: ${{ env.ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - uses: azure/setup-helm@v5

      - name: helm upgrade --install
        env:
          CHARTS: ${{ inputs.charts }}
        run: |
          # En orden: para el TF, "postgres lluvia" (el Job de carga de lluvia necesita la base).
          for chart in $CHARTS; do
            [ -d "helm/charts/$chart" ] || { echo "skip $chart (not in helm/charts)"; continue; }
            args=()
            case "$chart" in
              postgres) ;;  # imagen oficial fijada en el chart, no del registry
              lluvia)   args=(--set image.repository="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/lluvia"
                              --set image.tag="$IMAGE_TAG"
                              --set gcp.cuentaServicio="lluvia-servicio@$PROJECT_ID.iam.gserviceaccount.com") ;;
              servicio-patron) args=(--set image.repository="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/app" --set image.tag="$IMAGE_TAG") ;;
              *)        args=(--set image.repository="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$chart" --set image.tag="$IMAGE_TAG") ;;
            esac
            helm upgrade --install "$chart" "helm/charts/$chart" "${args[@]}" --wait --timeout 5m
          done
          kubectl get pods,svc,hpa,pvc
