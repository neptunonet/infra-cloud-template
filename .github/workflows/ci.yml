# Class 4 (CI/CD with GitHub Actions and OIDC).
#   1) pytest for app/, model/, llm-gateway/ (Ollama gateway, Lab 4 3.3) and lluvia/ (TF)
#   2) docker build + smoke test (/healthz) for each service
#   3) on a push to main or a vX.Y.Z tag: push to Artifact Registry,
#      authenticated via Workload Identity Federation (OIDC). No JSON key.
#
# Tags pushed (scripts/compute-tags.sh): every push -> :<git sha>;
# a tag vX.Y.Z -> also :vX.Y.Z. There is no :latest (a moving tag is not a version).
#   git tag v0.1.0 && git push origin v0.1.0
#
# TF: solo se construye lo que cambió. Si un servicio no cambió desde el push anterior (ni su carpeta ni este
# workflow ni compute-tags.sh), su imagen de ese commit recibe también la etiqueta del commit nuevo con
# `gcloud artifacts docker tags add` (sugerencia de la devolución del Lab 4): mismo digest, sin build ni almacenamiento
# extra, y cada commit de main sigue teniendo sus 4 imágenes. Un tag vX.Y.Z etiqueta la imagen de su commit.
#
# REPOSITORY VARIABLES (Settings > Secrets and variables > Actions > Variables).
# They are identifiers, not secrets. Until GCP_PROJECT_ID exists the publish
# job is SKIPPED (grey), so a fresh copy of the template stays green.
#   GCP_PROJECT_ID                  e.g. "mi-proyecto-123"
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<NUMBER>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_SERVICE_ACCOUNT             e.g. "ci-artifact-writer@mi-proyecto-123.iam.gserviceaccount.com"
#   GCP_REGION                      optional, default us-central1
#   AR_REPOSITORY                   optional, default infra-cloud-template
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; only the publish job may ask for an OIDC token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [app, model, llm-gateway, lluvia]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: pytest ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: uv run --python 3.12 --with-requirements requirements.txt --with pytest --with httpx pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: app
            port: 8080
          - service: model
            port: 8081
          - service: llm-gateway
            port: 8082
          # TF: sin modelo entrenado responde con la tabla de votos; DESTINO vacío alcanza para el smoke test.
          - service: lluvia
            port: 8083
            docker_args: -e DESTINO=/tmp
    steps:
      - uses: actions/checkout@v7

      - name: docker build ${{ matrix.service }}
        run: docker build -t "${{ matrix.service }}:${{ github.sha }}" "./${{ matrix.service }}"

      - name: Smoke test (GET /healthz)
        env:
          IMAGE: ${{ matrix.service }}:${{ github.sha }}
          PORT: ${{ matrix.port }}
        run: |
          docker run -d --name smoke ${{ matrix.docker_args }} -p "$PORT:$PORT" "$IMAGE"
          # Retry for up to ~30 s instead of a fixed sleep: runners vary.
          if ! curl -sf --retry 30 --retry-delay 1 --retry-all-errors "http://localhost:$PORT/healthz"; then
            echo "::error::the container did not answer /healthz. Its logs:"
            docker logs smoke
            exit 1
          fi
          docker rm -f smoke

      # TF: la imagen de lluvia también corre en el VPS (arm64). Se construye bajo QEMU y se prueba que importe
      # todo (LightGBM, pyarrow, la API), para enterarse en el pull request y no recién al publicar.
      - name: QEMU (arm64)
        if: matrix.service == 'lluvia'
        uses: docker/setup-qemu-action@v4

      - name: Buildx (arm64)
        if: matrix.service == 'lluvia'
        uses: docker/setup-buildx-action@v4

      - name: Build y prueba arm64
        if: matrix.service == 'lluvia'
        run: |
          docker buildx build --platform linux/arm64 --load -t lluvia:arm64 ./lluvia
          docker run --rm --platform linux/arm64 -e DESTINO=/tmp lluvia:arm64 \
            python -c "import platform, lightgbm, pyarrow, serve, train; print('ok', platform.machine())"

  publish:
    # Never on pull requests; skipped (not failed) until the variables exist.
    if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets THIS job ask GitHub for an OIDC token
    strategy:
      matrix:
        include:
          - service: app
          - service: model
          - service: llm-gateway
          # TF: la misma imagen corre en GKE (amd64) y en el VPS de Clima Rutero (arm64).
          - service: lluvia
            platforms: linux/amd64,linux/arm64
    env:
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      AR_REPO: ${{ vars.AR_REPOSITORY || 'infra-cloud-template' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # para comparar con el push anterior

      - name: Check repository variables
        env:
          WIP: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          [ -n "$SA" ] || { echo "::error::repository variable GCP_SERVICE_ACCOUNT is empty"; exit 1; }
          case "$WIP" in
            projects/*/locations/global/workloadIdentityPools/*/providers/*) ;;
            *) echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER must be the full name: projects/<NUMBER>/locations/global/workloadIdentityPools/<pool>/providers/<provider>"; exit 1 ;;
          esac

      # GitHub issues a short-lived token; GCP verifies it against the
      # provider and lets us impersonate the service account. Nothing stored.
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # ¿Hay que construir? Si ya existe una imagen igual (la de este commit, en un tag vX.Y.Z; o la del push anterior,
      # si el servicio no cambió), alcanza con etiquetarla.
      - name: Changed or reusable?
        id: origen
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}
          BEFORE: ${{ github.event.before }}
          SERVICE: ${{ matrix.service }}
        run: |
          existe() { gcloud artifacts docker images describe "$1" --quiet >/dev/null 2>&1; }
          origen=""
          if existe "$IMAGE:$GITHUB_SHA"; then
            origen="$IMAGE:$GITHUB_SHA"
          elif [[ "$GITHUB_REF" == refs/heads/* && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
               && git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$SERVICE/" .github/workflows/ci.yml scripts/compute-tags.sh \
               && existe "$IMAGE:$BEFORE"; then
            origen="$IMAGE:$BEFORE"
          fi
          echo "origen=$origen" >> "$GITHUB_OUTPUT"
          if [ -n "$origen" ]; then echo "$SERVICE sin cambios: se reutiliza $origen"; else echo "$SERVICE cambió: se construye"; fi

      - name: Tag the existing image
        if: steps.origen.outputs.origen != ''
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}
          ORIGEN: ${{ steps.origen.outputs.origen }}
        run: |
          mapfile -t refs < <(./scripts/compute-tags.sh "$IMAGE" "$GITHUB_SHA" "$GITHUB_REF")
          for r in "${refs[@]}"; do
            [ "$r" = "$ORIGEN" ] && continue
            gcloud artifacts docker tags add "$ORIGEN" "$r" --quiet
            echo "tagged $r -> $ORIGEN"
          done

      - name: QEMU (multi-arch)
        if: matrix.platforms && steps.origen.outputs.origen == ''
        uses: docker/setup-qemu-action@v4

      - name: Buildx (multi-arch)
        if: matrix.platforms && steps.origen.outputs.origen == ''
        uses: docker/setup-buildx-action@v4

      - name: Configure Docker for Artifact Registry
        if: steps.origen.outputs.origen == ''
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push ${{ matrix.service }}
        if: steps.origen.outputs.origen == ''
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.service }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          mapfile -t refs < <(./scripts/compute-tags.sh "$IMAGE" "$GITHUB_SHA" "$GITHUB_REF")
          args=()
          for r in "${refs[@]}"; do args+=(-t "$r"); done
          if [ -n "$PLATFORMS" ]; then
            # Un solo manifiesto con las dos arquitecturas; sin attestations para que el digest sea el de la imagen.
            docker buildx build --platform "$PLATFORMS" --provenance=false --build-arg GIT_SHA="$GITHUB_SHA" "${args[@]}" --push "./${{ matrix.service }}"
            for r in "${refs[@]}"; do echo "pushed $r ($PLATFORMS)"; done
          else
            docker build "${args[@]}" "./${{ matrix.service }}"
            for r in "${refs[@]}"; do docker push "$r"; echo "pushed $r"; done
          fi
